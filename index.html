<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Wire – International News</title>
<meta name="description" content="AI-written briefs of international news, with links to the original reporting.">
<style>
:root{--bg:#fafaf7;--fg:#16181d;--mut:#667;--card:#fff;--line:#e3e3dc;--ac:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#101215;--fg:#eceef2;--mut:#98a0ad;--card:#181b20;--line:#2a2e36;--ac:#ff6b5e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Georgia,serif}
a{color:inherit;text-decoration:none}small,.tag,nav,input,button{font-family:system-ui,sans-serif}
header{border-bottom:3px solid var(--fg);padding:14px 16px 0;max-width:1100px;margin:auto}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:1.9rem;font-weight:700;letter-spacing:-.5px}.brand b{color:var(--ac)}
input{padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:min(100%,260px);font-size:15px}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 0;font-size:14px}
nav a{padding:5px 11px;border-radius:99px;white-space:nowrap}nav a.on,nav a:hover{background:var(--fg);color:var(--bg)}
main{max-width:1100px;margin:auto;padding:18px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h3{margin:6px 0;font-size:1.15rem;line-height:1.3}.card p{margin:6px 0;color:var(--mut);font-size:.95rem}
.card:hover h3{color:var(--ac)}.hero{grid-column:1/-1}.hero h3{font-size:1.8rem}
.tag{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);font-weight:700}
small{color:var(--mut)}h1{line-height:1.2;margin:.3em 0}
.src{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ac);padding:14px;border-radius:8px;margin:20px 0;font-family:system-ui,sans-serif}
.src a{color:var(--ac);font-weight:600}.art{max-width:720px;margin:auto}.art p.s{font-size:1.2rem}
button.more{display:block;margin:20px auto;padding:10px 22px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
footer{max-width:1100px;margin:30px auto;padding:16px;border-top:1px solid var(--line);color:var(--mut);font:13px/1.5 system-ui,sans-serif}
.empty{text-align:center;color:var(--mut);padding:60px 0}
</style></head><body>
<header><div class="top"><a href="#/" class="brand">Global<b>Wire</b></a>
<input id="q" type="search" placeholder="Search news…" aria-label="Search"></div><nav id="nav"></nav></header>
<main id="app"><p class="empty">Loading…</p></main>
<footer>Summaries are generated by AI from publishers' public feed headlines and descriptions, and may contain errors. Always read the original article, linked on every story. All trademarks and original reporting belong to their respective publishers. <a href="admin.html" style="text-decoration:underline">Admin</a></footer>
<script>
const CATS=["World","Politics","Business","Technology","Science","Health","Environment","Sports","Culture"];
let A=[],shown=24;const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago=d=>{const m=(Date.now()-new Date(d))/6e4;return m<60?Math.max(1,m|0)+" min ago":m<1440?(m/60|0)+" h ago":new Date(d).toLocaleDateString("en",{day:"numeric",month:"short",year:"numeric"})};
const card=(a,h)=>`<article class="card${h?" hero":""}"><a href="#/a/${a.id}"><span class="tag">${esc(a.category)}</span><h3>${esc(a.headline)}</h3></a><p>${esc(a.summary)}</p><small>${esc(a.source)} · ${ago(a.published)}</small></article>`;
function list(items,title){
  if(!items.length)return `<p class="empty">No stories found.</p>`;
  return (title?`<h2>${esc(title)}</h2>`:"")+`<div class="grid">${items.slice(0,shown).map((a,i)=>card(a,i==0&&!title)).join("")}</div>`+(items.length>shown?`<button class="more" onclick="shown+=24;route()">Load more</button>`:"");
}
function route(){
  const [,k,v]=decodeURIComponent(location.hash).split("/");
  $("#nav").innerHTML=`<a href="#/" class="${!k?"on":""}">Top</a>`+CATS.map(c=>`<a href="#/c/${c}" class="${v==c?"on":""}">${c}</a>`).join("");
  let h="",t="Global Wire – International News";
  if(k=="c"){h=list(A.filter(a=>a.category==v),v);t=v+" News – Global Wire"}
  else if(k=="s"){const w=(v||"").toLowerCase().split(/\s+/).filter(Boolean);h=list(A.filter(a=>w.every(x=>(a.headline+" "+a.summary+" "+a.source+" "+a.category).toLowerCase().includes(x))),`Results for “${v}”`)}
  else if(k=="a"){const a=A.find(x=>x.id==v);
    if(a){t=a.headline;h=`<div class="art"><span class="tag">${esc(a.category)}</span><h1>${esc(a.headline)}</h1><small>${esc(a.source)} · ${new Date(a.published).toUTCString()}</small><p class="s">${esc(a.summary)}</p>
    <div class="src">Source: <b>${esc(a.source)}</b><br>Original headline: ${esc(a.source_title)}<br><a href="${esc(a.source_url)}" target="_blank" rel="noopener nofollow">Read the full original article →</a></div>
    <small>This brief was written by AI from the publisher's feed description. It is not a substitute for the original reporting.</small>
    <h3>More in ${esc(a.category)}</h3><div class="grid">${A.filter(x=>x.category==a.category&&x.id!=a.id).slice(0,3).map(x=>card(x)).join("")}</div></div>`}
    else h=`<p class="empty">Story not found.</p>`}
  else h=list(A);
  $("#app").innerHTML=h;document.title=t;if(k!="a")scrollTo(0,0)
}
$("#q").addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.value.trim()){shown=24;location.hash="#/s/"+encodeURIComponent(e.target.value.trim())}});
addEventListener("hashchange",()=>{shown=24;route()});
fetch("data/articles.json?t="+Date.now()).then(r=>r.json()).then(d=>{A=d.filter(a=>!a.hidden);route()}).catch(()=>{$("#app").innerHTML=`<p class="empty">Could not load news.</p>`});
</script></body></html>
